[project]
name = "mishearing-corpus"
version = "0.1.0"
description = "Mishearing Corpus data tools and Streamlit viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "GitPython>=3.1.44",
    "click>=8.0,<8.2",
    "duckdb",
    "frictionless==5.18.1",
    "loguru==0.7.3",
    "pandas==2.2.3",
    "pre-commit==4.2.0",
    "pytest",
    "python-slugify==8.0.4",
    "streamlit",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "ruff>=0.6,<1",
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["corpus_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
